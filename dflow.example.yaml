# AutoKnit 配置样例 —— 复制成 dflow.yaml 放任务目录或项目根即可生效
# 三通道优先级（低→高）：dflow.yaml < env 变量(FW_*) < CLI flag
#
# 全部键均可省略（用默认值）：分块阈值/并行/轮数/模型/思考模式。

runtime:
  # —— 并行与调度 ——
  max_parallel: 3                # 最大并行模块数（默认 3）
  executor_max_rounds: 5         # 单模块 executor 轮数上限（超了判卡循环换人/回人）
  retry_before_switch: 2         # auditor 打回 N 次后换 executor
  max_executor_switches: 1       # 最多换几个 executor，再卡回人
  heartbeat_n_rounds: 2          # 连续 N 轮无实质产出 → 判静默卡死
  checkpoint_every: 1            # 每 N 模块完成写一次快照

  # —— 分块 / 拆分（核心调参点）——
  split_exit_threshold: 1000     # 📌 剩余行数 ≤ N → 收官续做；>N → split（默认 1000）
  retry_remaining_threshold: 2   # 📌 partial 剩余交付物 ≤ N 项 → 原 executor 续做（默认 2）
  split_max_depth: 2             # 最大递归拆分深度（防无限递归）
  enable_split: true             # 是否启用自动拆分（false = 超量直接回人）

  # —— 出口 / 模式 ——
  end_gate: auto                 # auto=异常才回人 / always=每任务人工确认
  mode: speed_first              # speed_first=吞吐优先 / cost_first=省 token

models:
  # 各角色模型 + 思考模式。reasoning_effort: low|medium|high（对应官方 thinking.reasoning_effort）
  # provider 默认 deepseek-official（官方 API），可换 volcengine-agent-plan 等
  planner:
    model: deepseek-v4-flash
    provider: deepseek-official
    reasoning_effort: low
  executor:
    model: deepseek-v4-flash
    provider: deepseek-official
    reasoning_effort: low
  auditor:
    model: deepseek-v4-flash
    provider: deepseek-official
    reasoning_effort: low
  split:
    model: deepseek-v4-flash
    provider: deepseek-official
    reasoning_effort: low
