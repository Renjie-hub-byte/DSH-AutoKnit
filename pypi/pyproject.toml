[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoknit"
version = "1.0.1"
description = "AutoKnit — divide-and-conquer PRD execution framework: PRD in, stable maintainable code out. Program does the scheduling (0 token), LLM only thinks."
readme = "PYPI.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Renjie"}]
keywords = ["llm", "agent", "orchestration", "deepseek", "code-generation", "divide-and-conquer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = ["pyyaml>=5", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/Renjie-hub-byte/DSH-AutoKnit"
Issues = "https://github.com/Renjie-hub-byte/DSH-AutoKnit/issues"

[project.scripts]
autoknit = "autoknit_pkg.cli:main"

[tool.setuptools.packages.find]
include = ["autoknit_pkg*"]

[tool.setuptools.package-data]
autoknit_pkg = ["framework/**/*"]
