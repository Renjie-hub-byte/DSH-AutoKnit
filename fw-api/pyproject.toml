[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-api"
version = "0.1.0"
description = "AutoKnit 对外接口层：dsh.* 接口（task.list/detail/update/reply + session/usage），任何前端/cockpit 通过接口消费"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
